path:
  home: /usr/local/lib/filebeat
  data: /opt/filebeat/data
  logs: /opt/filebeat/log
  config: /opt/filebeat/conf
setup:
  template:
    enabled: true
    fields: "${path.home}/fields.yml"
    overwrite: true
    settings:
      index:
        number_of_shards: 1
        codec: best_compression
      _source:
        enabled: false
  dashboards:
    enabled: true
    directory: ${path.home}/kibana
  kibana:
    host: "localhost:5601"
  ilm:
    enabled: true
  dsl:
    enabled: false
logging:
  level: info
  to_files: true
  files:
    path: ${path.logs}
    name: agent.log
    permissions: 0644
  event_data:
    to_files: true
    path: ${path.logs}
    name: event.log
    permissions: 0644
keystore:
  path: "${path.data}/beats.keystore"
monitoring:
  enabled: false
instrumentation:
  enabled: false
http:
  enabled: false
  host: localhost
  port: 5066
seccomp:
  enabled: false
migration:
  6_to_7:
    enabled: false
filebeat:
  registry:
    path: ${path.data}/registry
    migrate_file: ${path.data}/registry
  config:
    modules:
      enabled: true
      path: ${path.config}/modules.d/*.yml
      reload:
        enabled: true
  inputs:
    - type: filestream
      id: default-filestream-id
      enabled: true
      paths:
        - /var/log/*.log
  overwrite_pipelines: true
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
output:
  elasticsearch:
    enabled: false
    hosts: ["localhost:9200"]
    preset: balanced
  logstash:
    enabled: true
    hosts: ["localhost:5044"]
    worker: 1
