path:
  home: /usr/local/lib/heartbeat
  data: /opt/heartbeat/data
  logs: /opt/heartbeat/log
  config: /opt/heartbeat/conf
setup:
  template:
    enabled: true
    fields: "${path.home}/fields.yml"
    overwrite: true
    settings:
      index:
        number_of_shards: 1
        codec: best_compression
      _source:
        enabled: false
  dashboards:
    enabled: true
    directory: ${path.home}/kibana
  kibana:
    host: "localhost:5601"
  ilm:
    enabled: false
  dsl:
    enabled: false
logging:
  level: warning
  to_files: true
  files:
    path: ${path.logs}
    name: agent.log
    permissions: 0644
  event_data:
    to_files: true
    path: ${path.logs}
    name: event.log
    permissions: 0644
keystore:
  path: "${path.data}/beats.keystore"
monitoring:
  enabled: false
instrumentation:
  enabled: false
http:
  enabled: false
  host: localhost
  port: 5066
seccomp:
  enabled: false
migration:
  6_to_7:
    enabled: true
heartbeat:
  config:
    monitors:
      enabled: true
      path: ${path.config}/monitors.d/*.yml
      reload:
        enabled: true
processors:
  - add_observer_metadata:
output:
  elasticsearch:
    enabled: false
    hosts: ["localhost:9200"]
    preset: balanced
  logstash:
    enabled: true
    hosts: ["localhost:5044"]
    worker: 1
